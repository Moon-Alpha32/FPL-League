<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FPL H2H · League 79703</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #0b0f1a;
      --surface:  #111827;
      --surface2: #1a2235;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --text:     #f1f5f9;
      --muted:    #64748b;
      --muted2:   #94a3b8;
      --green:    #22c55e;
      --green-dim:rgba(34,197,94,0.12);
      --green-bd: rgba(34,197,94,0.28);
      --blue:     #3b82f6;
      --amber:    #f59e0b;
      --red:      #ef4444;
      --red-dim:  rgba(239,68,68,0.10);
      --red-bd:   rgba(239,68,68,0.28);
      --purple:   #a78bfa;
      --mono:     'JetBrains Mono', monospace;
      --r:        10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { font-size:14px; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:8px; }
    a { color:var(--blue); text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    @keyframes spin    { to{transform:rotate(360deg);} }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;} }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);} }

    /* ── HEADER ── */
    header {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:0 24px; height:58px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:100;
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-logo {
      width:34px; height:34px; border-radius:8px;
      background:linear-gradient(135deg,#22c55e,#3b82f6);
      display:flex; align-items:center; justify-content:center;
    }
    .brand-logo svg { color:#fff; }
    .brand-name { font-size:15px; font-weight:800; letter-spacing:-.3px; }
    .brand-sub  { font-size:11px; color:var(--muted); margin-left:6px; padding:2px 8px; background:var(--surface2); border-radius:20px; border:1px solid var(--border2); }
    .header-right { display:flex; align-items:center; gap:8px; }
    .live-pill {
      display:none; align-items:center; gap:6px;
      background:var(--green-dim); border:1px solid var(--green-bd);
      border-radius:20px; padding:4px 12px; font-size:11px; font-weight:600; color:var(--green);
    }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse-dot 1.4s ease infinite; }
    #last-updated { font-size:11px; color:var(--muted); }

    /* ── MAIN ── */
    main { max-width:1000px; margin:0 auto; padding:24px 16px 80px; }

    /* ── SETUP CARD ── */
    #setup-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); padding:40px 32px;
      max-width:480px; margin:60px auto; text-align:center;
      animation:fadeUp .5s ease;
    }
    #setup-card .icon-wrap {
      width:60px; height:60px; border-radius:16px; margin:0 auto 20px;
      background:var(--green-dim); border:1px solid var(--green-bd);
      display:flex; align-items:center; justify-content:center;
    }
    #setup-card .icon-wrap svg { color:var(--green); }
    #setup-card h1 { font-size:22px; font-weight:800; margin-bottom:8px; }
    #setup-card p  { font-size:13px; color:var(--muted2); line-height:1.7; margin-bottom:24px; }
    .input-row { display:flex; gap:8px; margin-bottom:10px; }
    #league-input {
      flex:1; background:var(--bg); border:1px solid var(--border2);
      border-radius:8px; padding:0 14px; height:42px;
      color:var(--text); font-size:15px; font-family:var(--mono); outline:none;
      transition:border-color .15s;
    }
    #league-input:focus { border-color:var(--green); }
    #load-btn {
      height:42px; padding:0 20px;
      background:var(--green); color:#fff; border:none; border-radius:8px;
      font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px;
      transition:opacity .15s; white-space:nowrap;
    }
    #load-btn:hover { opacity:.88; }
    #load-btn:disabled { background:var(--surface2); color:var(--muted); cursor:not-allowed; opacity:1; }
    .setup-hint { font-size:11px; color:var(--muted); line-height:1.6; }
    .setup-hint code { color:var(--green); font-family:var(--mono); }

    /* ── ERROR ── */
    .err-box {
      background:var(--red-dim); border:1px solid var(--red-bd);
      border-radius:var(--r); padding:14px 16px; margin-bottom:18px;
      display:flex; gap:10px; align-items:flex-start; animation:fadeUp .3s ease;
    }
    .err-box svg { color:var(--red); flex-shrink:0; margin-top:1px; }
    .err-box p { font-size:13px; color:var(--muted2); line-height:1.55; }
    .err-box strong { color:var(--text); display:block; margin-bottom:3px; }

    /* ── LOADING ── */
    #loading-state { display:flex; flex-direction:column; align-items:center; gap:14px; padding:80px 20px; color:var(--muted2); }
    #loading-state p { font-size:13px; }
    .spinner { border:2px solid var(--border2); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; flex-shrink:0; }

    /* ── DASHBOARD ── */
    #dashboard { display:none; animation:fadeUp .4s ease; }

    /* summary strip */
    .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
    .s-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; }
    .s-card .lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:5px; display:flex; align-items:center; gap:5px; }
    .s-card .val { font-family:var(--mono); font-size:20px; font-weight:700; }

    /* tabs */
    .tabs { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:4px; margin-bottom:20px; }
    .tab { flex:1; padding:8px; border-radius:7px; border:1px solid transparent; font-size:12px; font-weight:500; color:var(--muted); background:none; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
    .tab.active { background:var(--surface2); color:var(--text); font-weight:600; border-color:var(--border2); }
    .tab:hover:not(.active) { color:var(--muted2); }
    .panel { display:none; }
    .panel.active { display:block; animation:fadeUp .25s ease; }

    /* section header */
    .sec-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .sec-hdr h2 { font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; color:var(--muted2); text-transform:uppercase; letter-spacing:.8px; }
    .sec-hdr h2 svg { color:var(--green); }
    .btn-sm {
      background:none; border:1px solid var(--border2); color:var(--muted2);
      border-radius:7px; padding:6px 12px; font-size:12px; font-weight:500;
      display:flex; align-items:center; gap:6px; transition:all .15s;
    }
    .btn-sm:hover { border-color:var(--green-bd); color:var(--green); }
    .btn-sm svg { flex-shrink:0; }

    /* standings table */
    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead th {
      text-align:left; font-size:10px; font-weight:700; letter-spacing:.8px;
      text-transform:uppercase; color:var(--muted); padding:0 10px 10px;
      border-bottom:1px solid var(--border); white-space:nowrap;
    }
    thead th.c { text-align:center; }
    tbody td { padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:var(--surface2); }

    .pos-cell { width:34px; text-align:center; font-family:var(--mono); font-weight:700; font-size:13px; }
    .pos-1 { color:#ffd700; }
    .pos-2 { color:#c0c0c0; }
    .pos-3 { color:#cd7f32; }
    .pos-other { color:var(--muted); }

    .mgr-name { font-weight:600; font-size:13px; }
    .mgr-team { font-size:11px; color:var(--muted); margin-top:2px; }

    .num-cell { text-align:center; font-family:var(--mono); font-weight:600; }
    .pts-cell { text-align:center; font-family:var(--mono); font-weight:800; font-size:15px; color:var(--green); }
    .gd-pos  { color:var(--green); }
    .gd-neg  { color:var(--red); }
    .gd-zero { color:var(--muted); }

    .form-pills { display:flex; gap:3px; justify-content:center; }
    .fp { width:20px; height:20px; border-radius:4px; font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; }
    .fp.W { background:rgba(34,197,94,.2);  color:var(--green); }
    .fp.D { background:rgba(245,158,11,.15);color:var(--amber); }
    .fp.L { background:var(--red-dim);      color:var(--red);   }
    .fp.N { background:var(--surface2);     color:var(--muted); }

    /* streak badge */
    .streak { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; margin-top:3px; }
    .streak.W { background:rgba(34,197,94,.12); color:var(--green); }
    .streak.L { background:var(--red-dim);      color:var(--red); }
    .streak.D { background:rgba(245,158,11,.12);color:var(--amber); }

    /* gw results */
    .gw-bar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .gw-bar label { font-size:12px; color:var(--muted); }
    .gw-select {
      background:var(--bg); border:1px solid var(--border2); border-radius:7px;
      color:var(--text); font-size:12px; padding:5px 10px; outline:none;
      font-family:inherit; cursor:pointer;
    }
    .gw-select:focus { border-color:var(--green); }
    .gw-pts-note { font-size:11px; color:var(--muted); margin-left:auto; }

    .matches-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; }
    .match-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); padding:14px;
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    }
    .match-card.is-live { border-color:var(--green-bd); background:rgba(34,197,94,.04); }
    .mc-side { display:flex; flex-direction:column; gap:2px; }
    .mc-side.right { text-align:right; align-items:flex-end; }
    .mc-name { font-size:13px; font-weight:600; }
    .mc-name.winner { color:var(--green); }
    .mc-team { font-size:11px; color:var(--muted); }
    .mc-gw-pts { font-size:11px; color:var(--muted2); font-family:var(--mono); margin-top:2px; }

    .mc-score { display:flex; flex-direction:column; align-items:center; gap:3px; padding:0 6px; }
    .mc-nums { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-weight:800; font-size:20px; }
    .mc-sep { color:var(--muted); font-size:14px; font-weight:400; }
    .mc-label { font-size:9px; letter-spacing:.5px; color:var(--muted); font-weight:600; }
    .sc-win  { color:var(--green); }
    .sc-lose { color:var(--red); }
    .sc-draw { color:var(--amber); }
    .sc-tbd  { color:var(--muted); font-size:14px; }

    /* head to head history */
    .h2h-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
    .h2h-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); padding:14px;
    }
    .h2h-names { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
    .h2h-name { font-size:12px; font-weight:700; flex:1; }
    .h2h-name.right { text-align:right; }
    .h2h-vs { font-size:10px; color:var(--muted); font-weight:600; flex-shrink:0; }
    .h2h-record { display:flex; gap:6px; justify-content:center; }
    .h2h-box { flex:1; text-align:center; background:var(--surface2); border-radius:6px; padding:6px; }
    .h2h-box .hb-num { font-family:var(--mono); font-size:16px; font-weight:800; }
    .h2h-box .hb-lbl { font-size:9px; color:var(--muted); letter-spacing:.5px; margin-top:2px; }
    .h2h-box.win  { background:var(--green-dim); }
    .h2h-box.win .hb-num { color:var(--green); }
    .h2h-box.lose .hb-num { color:var(--red); }

    /* stats tab */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
    .stat-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); padding:16px;
    }
    .stat-card .sc-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:8px; display:flex; align-items:center; gap:5px; }
    .stat-card .sc-lbl svg { color:var(--green); }
    .stat-entry { display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); }
    .stat-entry:last-child { border-bottom:none; }
    .stat-entry .se-name { font-size:12px; font-weight:600; }
    .stat-entry .se-val  { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--green); }

    @media(max-width:640px){
      .summary-strip { grid-template-columns:repeat(2,1fr); }
      .tab span { display:none; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </div>
    <span class="brand-name">FPL H2H</span>
    <span class="brand-sub" id="league-name-badge">League Dashboard</span>
  </div>
  <div class="header-right">
    <div class="live-pill" id="live-pill">
      <div class="live-dot"></div> LIVE
    </div>
    <span id="last-updated"></span>
  </div>
</header>

<main>
  <div id="error-area"></div>

  <!-- SETUP -->
  <div id="setup-card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </div>
    <h1>H2H League Dashboard</h1>
    <p>Live standings, match results, head-to-head records and season stats for your Fantasy Premier League head-to-head league.</p>
    <div class="input-row">
      <input id="league-input" type="number" placeholder="Enter League ID…" autocomplete="off"/>
      <button id="load-btn" onclick="handleLoad()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Load
      </button>
    </div>
    <p class="setup-hint">
      Find your League ID in the FPL URL:<br>
      <code>fantasy.premierleague.com/leagues/<strong>123456</strong>/standings/h</code>
    </p>
  </div>

  <!-- LOADING -->
  <div id="loading-state" style="display:none">
    <span class="spinner" style="width:28px;height:28px"></span>
    <p id="loading-msg">Fetching league data…</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <!-- summary strip -->
    <div class="summary-strip" id="summary-strip"></div>

    <!-- tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showTab('standings')">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Standings</span>
      </button>
      <button class="tab" onclick="showTab('results')">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Results</span>
      </button>
      <button class="tab" onclick="showTab('h2h')">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span>H2H Records</span>
      </button>
      <button class="tab" onclick="showTab('stats')">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Stats</span>
      </button>
    </div>

    <div id="panel-standings" class="panel active"></div>
    <div id="panel-results"   class="panel"></div>
    <div id="panel-h2h"       class="panel"></div>
    <div id="panel-stats"     class="panel"></div>
  </div>
</main>

<script>
// ── Pre-configured league ID — loads automatically on open ──
const DEFAULT_LEAGUE_ID = "79703";

// ── CORS proxies (no localhost — this tool is for online sharing) ──
const FPL = "https://fantasy.premierleague.com/api";
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

let S = {
  leagueId: "",
  leagueName: "",
  standings: [],
  allMatches: [],
  gwList: [],
  selectedGW: null,
  currentGWId: null,
  isLive: false,
  refreshTimer: null,
  lastLoaded: 0,
};

// ── Fetch ──────────────────────────────────────
async function apiFetch(path) {
  const url = `${FPL}${path}`;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { signal: AbortSignal.timeout(9000) });
      if (!res.ok) continue;
      const j = await res.json();
      if (j) return j;
    } catch(e) { continue; }
  }
  throw new Error("All proxies failed. Please try again in a moment.");
}

// ── Entry point ────────────────────────────────
function handleLoad() {
  const val = document.getElementById("league-input").value.trim();
  if (!val || isNaN(val)) { showErr("Please enter a valid numeric League ID."); return; }
  clearErr();
  loadLeague(val);
}

document.getElementById("league-input").addEventListener("keydown", e => {
  if (e.key === "Enter") handleLoad();
});

// Check URL param ?league=XXXXX on page load
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const lid = params.get("league") || DEFAULT_LEAGUE_ID;
  document.getElementById("league-input").value = lid;
  loadLeague(lid);
});

async function loadLeague(leagueId) {
  setLoading(true, "Fetching standings…");
  document.getElementById("setup-card").style.display = "none";
  clearErr();

  try {
    // Bootstrap for current GW
    setLoading(true, "Fetching current gameweek…");
    let currentGWId = null;
    try {
      const boot = await apiFetch("/bootstrap-static/");
      const cur = boot.events.find(e => e.is_current) || boot.events.find(e => e.is_next);
      currentGWId = cur?.id || null;
      S.currentGWId = currentGWId;
    } catch(e) { /* non-fatal */ }

    // Standings
    setLoading(true, "Fetching standings…");
    const sd = await apiFetch(`/leagues-h2h/${leagueId}/standings/`);
    if (!sd.standings) throw new Error("Not a valid H2H league ID. Check the ID and try again.");
    S.leagueName = sd.league.name;
    S.standings  = sd.standings.results;
    S.leagueId   = leagueId;

    // Matches — up to 5 pages
    setLoading(true, "Fetching match history…");
    let all = [], page = 1, hasNext = true;
    while (hasNext && page <= 5) {
      const md = await apiFetch(`/leagues-h2h-matches/league/${leagueId}/?page=${page}`);
      all = all.concat(md.results || []);
      hasNext = !!md.has_next;
      page++;
    }
    S.allMatches  = all;
    S.gwList      = [...new Set(all.map(m => m.event))].sort((a,b) => a-b);
    S.selectedGW  = currentGWId && S.gwList.includes(currentGWId) ? currentGWId : S.gwList[S.gwList.length - 1];
    S.lastLoaded  = Date.now();
    S.isLive      = currentGWId && all.filter(m => m.event === currentGWId)
                      .some(m => m.entry_1_points === null || m.entry_2_points === null);

    setLoading(false);
    renderDashboard();

    // Auto-refresh every 60s
    clearInterval(S.refreshTimer);
    S.refreshTimer = setInterval(() => refreshData(), 60000);

  } catch(err) {
    setLoading(false);
    document.getElementById("setup-card").style.display = "block";
    showErr(err.message);
  }
}

async function refreshData() {
  try {
    const sd = await apiFetch(`/leagues-h2h/${S.leagueId}/standings/`);
    S.standings = sd.standings.results;
    let all = [], page = 1, hasNext = true;
    while (hasNext && page <= 5) {
      const md = await apiFetch(`/leagues-h2h-matches/league/${S.leagueId}/?page=${page}`);
      all = all.concat(md.results || []);
      hasNext = !!md.has_next;
      page++;
    }
    S.allMatches = all;
    S.lastLoaded = Date.now();
    S.isLive = S.currentGWId && all.filter(m => m.event === S.currentGWId)
                 .some(m => m.entry_1_points === null || m.entry_2_points === null);
    renderDashboard();
  } catch(e) { /* silent fail on refresh */ }
}

// ── UI Helpers ─────────────────────────────────
function setLoading(on, msg) {
  document.getElementById("loading-state").style.display = on ? "flex" : "none";
  document.getElementById("dashboard").style.display = on ? "none" : "block";
  if (msg) document.getElementById("loading-msg").textContent = msg;
  const btn = document.getElementById("load-btn");
  btn.disabled = on;
  btn.innerHTML = on
    ? `<span class="spinner" style="width:13px;height:13px"></span>`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Load`;
}
function showErr(msg) {
  document.getElementById("error-area").innerHTML = `
    <div class="err-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p><strong>Error</strong>${msg}</p>
    </div>`;
}
function clearErr() { document.getElementById("error-area").innerHTML = ""; }

function showTab(id) {
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", ["standings","results","h2h","stats"][i] === id));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`panel-${id}`).classList.add("active");
}

function icon(path, size=14) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

// ── Form & streak ──────────────────────────────
function getForm(entryId, upToGW, count=5) {
  return S.allMatches
    .filter(m => m.event <= upToGW && (m.entry_1_entry===entryId || m.entry_2_entry===entryId))
    .sort((a,b) => b.event - a.event)
    .slice(0, count)
    .reverse()
    .map(m => {
      const mine = m.entry_1_entry===entryId ? m.entry_1_points : m.entry_2_points;
      const opp  = m.entry_1_entry===entryId ? m.entry_2_points : m.entry_1_points;
      if (mine===null||opp===null) return {r:"N",gw:m.event};
      return {r: mine>opp?"W":mine<opp?"L":"D", gw:m.event};
    });
}

function getStreak(entryId) {
  const form = getForm(entryId, S.gwList[S.gwList.length-1], 20);
  const results = form.filter(f=>f.r!=="N").reverse();
  if (!results.length) return null;
  const latest = results[0].r;
  let count = 0;
  for (const f of results) { if (f.r===latest) count++; else break; }
  return count > 1 ? { r:latest, n:count } : null;
}

// ── RENDER DASHBOARD ───────────────────────────
function renderDashboard() {
  // Header
  document.getElementById("league-name-badge").textContent = S.leagueName;
  document.getElementById("live-pill").style.display = S.isLive ? "flex" : "none";
  const ago = Math.round((Date.now() - S.lastLoaded)/1000);
  document.getElementById("last-updated").textContent = ago < 5 ? "Just updated" : `Updated ${ago}s ago`;

  // URL param for sharing
  const url = new URL(window.location.href);
  url.searchParams.set("league", S.leagueId);
  window.history.replaceState({}, "", url);

  renderSummary();
  renderStandings();
  renderResults();
  renderH2H();
  renderStats();
}

// ── Summary strip ──────────────────────────────
function renderSummary() {
  const gw = S.currentGWId ? `GW ${S.currentGWId}` : `GW ${S.gwList[S.gwList.length-1]}`;
  const leader = S.standings[0];
  const totalMatches = S.allMatches.filter(m => m.entry_1_points!==null).length;
  document.getElementById("summary-strip").innerHTML = [
    { lbl:"League",   val:S.leagueName,              col:"var(--text)",   ic:`<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>` },
    { lbl:"Leader",   val:leader?.entry_name||"—",   col:"#ffd700",       ic:`<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>` },
    { lbl:"Managers", val:S.standings.length,         col:"var(--blue)",   ic:`<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>` },
    { lbl:"Gameweek", val:gw,                         col:"var(--purple)", ic:`<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>` },
  ].map(c=>`<div class="s-card"><div class="lbl">${icon(c.ic,12)}${c.lbl}</div><div class="val" style="color:${c.col};font-size:${c.val.toString().length>12?'13px':'20px'}">${c.val}</div></div>`).join("");
}

// ── STANDINGS ──────────────────────────────────
function renderStandings() {
  const gwForForm = S.gwList[S.gwList.length-1];
  const rows = S.standings.map((e,i) => {
    const pos   = i+1;
    const pCls  = pos===1?"pos-1":pos===2?"pos-2":pos===3?"pos-3":"pos-other";
    const form  = getForm(e.entry, gwForForm);
    const streak= getStreak(e.entry);
    const gd    = (e.points_for||0)-(e.points_against||0);
    const gdCls = gd>0?"gd-pos":gd<0?"gd-neg":"gd-zero";
    const formHtml = form.map(f=>`<div class="fp ${f.r}" title="GW${f.gw}">${f.r==="N"?"?":f.r}</div>`).join("");
    const streakHtml = streak ? `<div class="streak ${streak.r}">${streak.n} ${streak.r==="W"?"win":streak.r==="L"?"loss":"draw"} streak</div>` : "";
    return `<tr>
      <td class="pos-cell ${pCls}">${pos===1?"🥇":pos===2?"🥈":pos===3?"🥉":pos}</td>
      <td>
        <div class="mgr-name">${e.entry_name}</div>
        <div class="mgr-team">${e.player_name}</div>
        ${streakHtml}
      </td>
      <td class="num-cell" style="color:var(--green)">${e.matches_won||0}</td>
      <td class="num-cell" style="color:var(--amber)">${e.matches_drawn||0}</td>
      <td class="num-cell" style="color:var(--red)">${e.matches_lost||0}</td>
      <td class="num-cell ${gdCls}">${gd>0?"+":""}${gd}</td>
      <td class="pts-cell">${e.total||0}</td>
      <td><div class="form-pills">${formHtml}</div></td>
    </tr>`;
  }).join("");

  document.getElementById("panel-standings").innerHTML = `
    <div class="sec-hdr">
      <h2>${icon('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>')}Standings</h2>
      <button class="btn-sm" onclick="refreshData()">
        ${icon('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>')}
        Refresh
      </button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th class="c">#</th><th>Manager</th>
          <th class="c">W</th><th class="c">D</th><th class="c">L</th>
          <th class="c">GD</th><th class="c">Pts</th><th>Form (last 5)</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── RESULTS ────────────────────────────────────
function renderResults(gwOverride) {
  const gw = gwOverride || S.selectedGW;
  const gwOpts = S.gwList.map(g=>`<option value="${g}" ${g===gw?"selected":""}>${g===S.currentGWId?"GW "+g+" (Current)":"GW "+g}</option>`).join("");
  const matches = S.allMatches.filter(m=>m.event===gw);

  const cards = matches.map(m => {
    const p1=m.entry_1_points, p2=m.entry_2_points;
    const live = p1===null||p2===null;
    const p1w=!live&&p1>p2, p2w=!live&&p2>p1;
    const s1=live?"sc-tbd":p1w?"sc-win":p2w?"sc-lose":"sc-draw";
    const s2=live?"sc-tbd":p2w?"sc-win":p1w?"sc-lose":"sc-draw";
    const lbl=live?(S.isLive?"LIVE":"TBD"):"FT";
    return `<div class="match-card ${live&&S.isLive?"is-live":""}">
      <div class="mc-side">
        <div class="mc-name ${p1w?"winner":""}">${m.entry_1_name}</div>
        <div class="mc-team">${m.entry_1_player_name}</div>
        ${m.entry_1_total?`<div class="mc-gw-pts">${m.entry_1_total} total pts</div>`:""}
      </div>
      <div class="mc-score">
        <div class="mc-nums">
          <span class="${s1}">${live?"—":p1}</span>
          <span class="mc-sep">-</span>
          <span class="${s2}">${live?"—":p2}</span>
        </div>
        <div class="mc-label">${lbl}</div>
      </div>
      <div class="mc-side right">
        <div class="mc-name ${p2w?"winner":""}">${m.entry_2_name}</div>
        <div class="mc-team">${m.entry_2_player_name}</div>
        ${m.entry_2_total?`<div class="mc-gw-pts">${m.entry_2_total} total pts</div>`:""}
      </div>
    </div>`;
  }).join("") || `<p style="color:var(--muted);font-size:13px;text-align:center;padding:30px">No matches found for this gameweek.</p>`;

  document.getElementById("panel-results").innerHTML = `
    <div class="sec-hdr">
      <h2>${icon('<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>')}Match Results</h2>
    </div>
    <div class="gw-bar">
      <label>Gameweek:</label>
      <select class="gw-select" onchange="S.selectedGW=parseInt(this.value);renderResults(parseInt(this.value))">${gwOpts}</select>
      <span class="gw-pts-note">${matches.length} match${matches.length!==1?"es":""}</span>
    </div>
    <div class="matches-grid">${cards}</div>`;
}

// ── H2H RECORDS ────────────────────────────────
function renderH2H() {
  const entries = S.standings;
  // Build all unique pairs
  const pairs = [];
  for (let i=0;i<entries.length;i++) {
    for (let j=i+1;j<entries.length;j++) {
      const a=entries[i], b=entries[j];
      const games = S.allMatches.filter(m =>
        m.entry_1_points!==null && (
          (m.entry_1_entry===a.entry&&m.entry_2_entry===b.entry) ||
          (m.entry_1_entry===b.entry&&m.entry_2_entry===a.entry)
        )
      );
      if (!games.length) continue;
      let aw=0,bw=0,d=0;
      games.forEach(m => {
        const aIsE1 = m.entry_1_entry===a.entry;
        const ap = aIsE1?m.entry_1_points:m.entry_2_points;
        const bp = aIsE1?m.entry_2_points:m.entry_1_points;
        if (ap>bp) aw++; else if (bp>ap) bw++; else d++;
      });
      pairs.push({a,b,aw,bw,d,games:games.length});
    }
  }

  const cards = pairs.map(p=>`
    <div class="h2h-card">
      <div class="h2h-names">
        <div class="h2h-name">${p.a.entry_name}</div>
        <div class="h2h-vs">VS</div>
        <div class="h2h-name right">${p.b.entry_name}</div>
      </div>
      <div class="h2h-record">
        <div class="h2h-box ${p.aw>p.bw?"win":""}">
          <div class="hb-num">${p.aw}</div>
          <div class="hb-lbl">WINS</div>
        </div>
        <div class="h2h-box">
          <div class="hb-num" style="color:var(--amber)">${p.d}</div>
          <div class="hb-lbl">DRAWS</div>
        </div>
        <div class="h2h-box ${p.bw>p.aw?"win":"lose"}">
          <div class="hb-num">${p.bw}</div>
          <div class="hb-lbl">WINS</div>
        </div>
      </div>
    </div>`).join("") || `<p style="color:var(--muted);font-size:13px;text-align:center;padding:30px">Not enough match data yet.</p>`;

  document.getElementById("panel-h2h").innerHTML = `
    <div class="sec-hdr">
      <h2>${icon('<path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>')}Head-to-Head Records</h2>
    </div>
    <div class="h2h-grid">${cards}</div>`;
}

// ── STATS ──────────────────────────────────────
function renderStats() {
  const completed = S.allMatches.filter(m=>m.entry_1_points!==null&&m.entry_2_points!==null);

  // Most wins
  const wins={}, losses={}, pts={}, highScore={}, gwPts={};
  S.standings.forEach(e=>{wins[e.entry]=0;losses[e.entry]=0;pts[e.entry]=0;highScore[e.entry]=0;});
  completed.forEach(m=>{
    const e1=m.entry_1_entry,e2=m.entry_2_entry;
    const p1=m.entry_1_points,p2=m.entry_2_points;
    pts[e1]=(pts[e1]||0)+p1; pts[e2]=(pts[e2]||0)+p2;
    highScore[e1]=Math.max(highScore[e1]||0,p1); highScore[e2]=Math.max(highScore[e2]||0,p2);
    if(p1>p2){wins[e1]=(wins[e1]||0)+1;losses[e2]=(losses[e2]||0)+1;}
    else if(p2>p1){wins[e2]=(wins[e2]||0)+1;losses[e1]=(losses[e1]||0)+1;}
    // GW-level team pts
    if(!gwPts[m.event]) gwPts[m.event]={};
    gwPts[m.event][e1]=(gwPts[m.event][e1]||0)+p1;
    gwPts[m.event][e2]=(gwPts[m.event][e2]||0)+p2;
  });

  const entryName = id => (S.standings.find(e=>e.entry===id)||{}).entry_name||"Unknown";

  const topWins = Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topHighScore = Object.entries(highScore).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topPts = Object.entries(pts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topLosses = Object.entries(losses).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Best/worst GW score
  let bestGW={pts:0,name:"",gw:0}, worstGW={pts:9999,name:"",gw:0};
  Object.entries(gwPts).forEach(([gw,scores])=>{
    Object.entries(scores).forEach(([eid,p])=>{
      if(p>bestGW.pts){bestGW={pts:p,name:entryName(parseInt(eid)),gw};}
      if(p<worstGW.pts){worstGW={pts:p,name:entryName(parseInt(eid)),gw};}
    });
  });

  const statBlock = (label, iconPath, entries, unit="") => `
    <div class="stat-card">
      <div class="sc-lbl">${icon(iconPath,12)}${label}</div>
      ${entries.map(([id,val],i)=>`
        <div class="stat-entry">
          <div class="se-name">${i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":""}${entryName(parseInt(id))}</div>
          <div class="se-val">${val}${unit}</div>
        </div>`).join("")}
    </div>`;

  document.getElementById("panel-stats").innerHTML = `
    <div class="sec-hdr">
      <h2>${icon('<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>')}Season Stats</h2>
    </div>
    <div class="stats-grid">
      ${statBlock("Most Wins",'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',topWins)}
      ${statBlock("Highest Single Score",'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',topHighScore," pts")}
      ${statBlock("Most Points Scored",'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',topPts," pts")}
      ${statBlock("Most Losses",'<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',topLosses)}
      <div class="stat-card">
        <div class="sc-lbl">${icon('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',12)}Record Scores</div>
        <div class="stat-entry">
          <div class="se-name">🔥 Best GW (${bestGW.name})</div>
          <div class="se-val">${bestGW.pts} pts</div>
        </div>
        <div class="stat-entry">
          <div class="se-name">❄️ Worst GW (${worstGW.pts<9999?worstGW.name:"—"})</div>
          <div class="se-val">${worstGW.pts<9999?worstGW.pts+" pts":"—"}</div>
        </div>
        <div class="stat-entry">
          <div class="se-name">Total matches played</div>
          <div class="se-val">${completed.length}</div>
        </div>
      </div>
    </div>`;
}
</script>
