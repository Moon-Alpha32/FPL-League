<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fantasy Premier League · H2H Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"/></noscript>
<style>
:root {
  --fpl-purple: #37003c;
  --fpl-green:  #00ff87;
  --fpl-cyan:   #04f5ff;
  --fpl-pink:   #ff2882;
  --bg:         #120016;
  --surface:    #1e0a24;
  --surface2:   #2a1030;
  --surface3:   #341640;
  --border:     rgba(255,255,255,0.08);
  --border2:    rgba(255,255,255,0.14);
  --text:       #ffffff;
  --muted:      #8b6b99;
  --muted2:     #b89ec4;
  --green:      #00ff87;
  --green-dim:  rgba(0,255,135,0.10);
  --green-bd:   rgba(0,255,135,0.25);
  --cyan:       #04f5ff;
  --pink:       #ff2882;
  --pink-dim:   rgba(255,40,130,0.10);
  --amber:      #ffab40;
  --red:        #ff4d4d;
  --red-dim:    rgba(255,77,77,0.10);
  --mono:       'JetBrains Mono', monospace; /* code only */
  --r:          10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;}
a{color:var(--cyan);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes floatIn{from{opacity:0;transform:scale(.96)translateY(8px);}to{opacity:1;transform:none;}}

/* ── HERO HEADER ── */
#hero {
  position:relative; overflow:hidden;
  background:linear-gradient(170deg, #37003c 0%, #200028 50%, #0f0018 100%);
  border-bottom:1px solid rgba(0,255,135,.2);
  padding:0;
}

/* animated pitch lines canvas — full width */
#hero-canvas {
  position:absolute;inset:0;pointer-events:none;z-index:0;width:100%;height:100%;
}

#hero-inner {
  position:relative;z-index:2;
  max-width:1040px;margin:0 auto;
  padding:18px 24px 12px;
}
#top-bar {
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}

/* brand with PL logo */
.brand{display:flex;align-items:center;gap:12px;}
#pl-logo{
  height:42px;width:auto;flex-shrink:0;
  filter:drop-shadow(0 0 10px rgba(0,255,135,.35));
}
.brand-wordmark{display:flex;flex-direction:column;gap:2px;}
.brand-fpl{
  font-size:16px;font-weight:900;letter-spacing:-.3px;line-height:1;
  background:linear-gradient(90deg,#ffffff 0%,#cccccc 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-h2h{
  font-size:11px;font-weight:800;letter-spacing:2px;color:var(--green);
  text-transform:uppercase;border:1px solid var(--green-bd);border-radius:4px;
  padding:2px 7px;align-self:flex-start;
}
#live-pill{
  display:none;align-items:center;gap:6px;
  background:var(--green-dim);border:1px solid var(--green-bd);
  border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--green);
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse-dot 1.2s ease infinite;}
#last-updated{font-size:11px;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:10px;}



.player-fig:hover{transform:translateY(-6px) scale(1.06);}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes sway{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}
@keyframes kick{0%,100%{transform:rotate(0deg);}40%{transform:rotate(-8deg);}70%{transform:rotate(6deg);}}

.anim-sway{animation:sway 3.2s ease-in-out infinite;}
.anim-kick{animation:kick 2.4s ease-in-out infinite;}

.player-wrap{position:relative;display:flex;flex-direction:column;align-items:center;}



/* league title banner */
#league-banner{
  background:linear-gradient(90deg,rgba(0,255,135,.12),rgba(4,245,255,.06),transparent);
  border-top:1px solid rgba(0,255,135,.15);
  border-bottom:1px solid rgba(0,255,135,.08);
  padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
  max-width:none;
}
#league-banner-inner{max-width:1040px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;}
#league-title{font-size:15px;font-weight:800;color:var(--text);}
#league-meta{font-size:11px;color:var(--muted);}
#banner-refresh{
  background:none;border:1px solid var(--border2);color:var(--muted2);
  border-radius:7px;padding:5px 12px;font-size:11px;font-weight:500;
  display:flex;align-items:center;gap:5px;transition:all .15s;
}
#banner-refresh:hover{border-color:var(--green-bd);color:var(--green);}

/* ── MAIN ── */
main{max-width:1040px;margin:0 auto;padding:20px 16px 80px;}

/* ── SETUP ── */
#setup-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:60vh;animation:floatIn .5s ease;
}
#setup-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:16px;padding:40px 36px;width:100%;max-width:460px;text-align:center;
  position:relative;overflow:hidden;
}
#setup-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,255,135,.04) 0%,transparent 60%);
  pointer-events:none;
}
.setup-pitch{margin:0 auto 24px;width:72px;height:72px;position:relative;}
.setup-pitch svg{width:72px;height:72px;}
#setup-card h1{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px;}
#setup-card p{font-size:13px;color:var(--muted2);line-height:1.7;margin-bottom:24px;}
.input-row{display:flex;gap:8px;margin-bottom:10px;}
#league-input{
  flex:1;background:var(--bg);border:1px solid var(--border2);
  border-radius:8px;padding:0 14px;height:44px;
  color:var(--text);font-size:15px;outline:none;
  transition:border-color .15s;
}
#league-input:focus{border-color:var(--green);}
#load-btn{
  height:44px;padding:0 22px;
  background:var(--green);color:var(--fpl-purple);border:none;border-radius:8px;
  font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;
  transition:opacity .15s;white-space:nowrap;
}
#load-btn:hover{opacity:.88;}
#load-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;opacity:1;}
.setup-hint{font-size:11px;color:var(--muted);line-height:1.65;margin-top:6px;}
.setup-hint code{color:var(--green);font-family:monospace;font-size:11px;}

/* ── ERROR ── */
.err-box{
  background:var(--red-dim);border:1px solid rgba(255,77,77,.3);
  border-radius:var(--r);padding:14px 16px;margin-bottom:16px;
  display:flex;gap:10px;align-items:flex-start;animation:fadeUp .3s ease;
}
.err-box svg{color:var(--red);flex-shrink:0;margin-top:1px;}
.err-box p{font-size:13px;color:var(--muted2);line-height:1.55;}
.err-box strong{color:var(--text);display:block;margin-bottom:3px;}

/* ── LOADING ── */
#loading-state{display:flex;flex-direction:column;align-items:center;gap:16px;padding:100px 20px;color:var(--muted2);}
#loading-state p{font-size:13px;}
.spinner{border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;}

/* ── DASHBOARD ── */
#dashboard{display:none;animation:fadeUp .35s ease;}

/* summary strip */
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.s-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;
  position:relative;overflow:hidden;
}
.s-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  opacity:0;transition:opacity .2s;
}
.s-card:hover::after{opacity:1;}
.s-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.s-card .lbl svg{color:var(--green);}
.s-card .val{font-size:19px;font-weight:800;line-height:1.2;}

/* tabs */
.tabs{
  display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:4px;margin-bottom:20px;
}
.tab{
  flex:1;padding:8px 10px;border-radius:7px;border:1px solid transparent;
  font-size:12px;font-weight:500;color:var(--muted);background:none;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab.active{
  background:linear-gradient(135deg,rgba(0,255,135,.12),rgba(4,245,255,.06));
  color:var(--green);font-weight:700;border-color:var(--green-bd);
}
.tab:hover:not(.active){color:var(--muted2);}
.tab svg{flex-shrink:0;}
.panel{display:none;}
.panel.active{display:block;animation:fadeUp .25s ease;}

/* section header */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-hdr h2{
  font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px;
  color:var(--muted2);text-transform:uppercase;letter-spacing:1px;
}
.sec-hdr h2 svg{color:var(--green);}
.btn-sm{
  background:none;border:1px solid var(--border2);color:var(--muted2);
  border-radius:7px;padding:6px 12px;font-size:11px;font-weight:500;
  display:flex;align-items:center;gap:5px;transition:all .15s;
}
.btn-sm:hover{border-color:var(--green-bd);color:var(--green);}
button,select,input{font-family:'Inter',system-ui,sans-serif;}

/* ── STANDINGS TABLE — PL LIGHT STYLE ── */
.tbl-wrap{
  overflow-x:auto;border-radius:10px;overflow:hidden;
  border:1px solid #e5e5e5;background:#fff;
}
.pl-table{width:100%;border-collapse:collapse;font-size:13px;}

/* Light grey header row, dark text — matches PL site */
.pl-table thead tr{background:#f8f8f8;border-bottom:2px solid #e0e0e0;}
.pl-table thead th{
  padding:10px 12px;font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#666;white-space:nowrap;
  border:none;text-align:center;
}
.pl-table thead th.left{text-align:left;}
.pl-table thead th.pos-th{width:50px;}

/* White rows, subtle divider */
.pl-table tbody tr{background:#fff;transition:background .1s;}
.pl-table tbody tr:hover td{background:#f5f8ff;}
.pl-table tbody td{
  padding:11px 12px;border-bottom:1px solid #f0f0f0;
  vertical-align:middle;text-align:center;font-size:13px;color:#222;
}
.pl-table tbody td.left{text-align:left;}
.pl-table tbody tr:last-child td{border-bottom:none;}

/* Left colour bar */
.pl-table tbody td.pos-td{width:50px;padding:0;}
.pos-bar-wrap{
  display:flex;align-items:center;
  height:100%;padding:11px 8px 11px 12px;gap:8px;
}
.pos-bar{width:3px;height:26px;border-radius:2px;flex-shrink:0;}
.pos-num{font-size:13px;font-weight:600;color:#222;min-width:16px;text-align:center;}
.pos-1 .pos-bar{background:#3d195b;}
.pos-2 .pos-bar{background:#3d195b;}
.pos-3 .pos-bar{background:#3d195b;}
.pos-4 .pos-bar{background:#ff8c00;}
.pos-other .pos-bar{background:transparent;}

/* Manager cell */
.mgr-cell{display:flex;flex-direction:column;gap:1px;}
.mgr-name{font-weight:700;font-size:13px;color:#111;}
.mgr-team{font-size:11px;color:#888;}

/* Stat cells — muted grey like PL */
.num-cell{color:#444;font-size:13px;font-weight:400;}
.pts-cell{font-weight:800;font-size:14px;color:#111;}
.gd-pos{color:#111;font-weight:400;}
.gd-neg{color:#111;font-weight:400;}
.gd-zero{color:#888;}

/* Form circles — exactly as PL screenshot */
.form-pills{display:flex;gap:3px;justify-content:center;align-items:center;}
.fp{
  width:22px;height:22px;border-radius:50%;font-size:8px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:#fff;letter-spacing:0;
}
.fp.W{background:#00963c;}
.fp.D{background:#b0b0b0;color:#fff;}
.fp.L{background:#d0021b;}
.fp.N{background:#e0e0e0;color:#999;}

/* Streak badge */
.streak-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;margin-top:3px;
  letter-spacing:.3px;text-transform:uppercase;
}
.streak-badge svg{flex-shrink:0;}
.streak-W{background:rgba(0,150,60,.1);color:#00963c;border:1px solid rgba(0,150,60,.25);}
.streak-L{background:rgba(208,2,27,.08);color:#d0021b;border:1px solid rgba(208,2,27,.2);}
.streak-D{background:rgba(100,100,100,.08);color:#666;border:1px solid rgba(100,100,100,.2);}

/* Legend */
.tbl-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;padding:0 2px;}
.tbl-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#888;}
.legend-bar{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

/* Section header above table */
.sec-hdr h2{color:#555;}
.sec-hdr h2 svg{color:#3d195b;}
.btn-sm{border-color:#ddd;color:#555;}
.btn-sm:hover{border-color:#3d195b;color:#3d195b;}

/* ── MATCH CARDS ── */
.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;}
.match-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  transition:border-color .15s;
}
.match-card:hover{border-color:var(--border2);}
.match-card.is-live{border-color:var(--green-bd);background:linear-gradient(135deg,rgba(0,255,135,.04),var(--surface));}
.mc-side{display:flex;flex-direction:column;gap:2px;}
.mc-side.right{text-align:right;align-items:flex-end;}
.mc-name{font-size:13px;font-weight:700;}
.mc-name.winner{color:var(--green);}
.mc-team{font-size:11px;color:var(--muted);}
.mc-gw-pts{font-size:11px;color:var(--muted2);margin-top:1px;}
.mc-score{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;}
.mc-nums{display:flex;align-items:center;gap:6px;font-weight:900;font-size:22px;}
.mc-sep{color:var(--muted);font-size:14px;font-weight:400;}
.mc-label{
  font-size:9px;letter-spacing:.8px;font-weight:700;padding:1px 6px;border-radius:3px;
}
.lbl-ft{background:var(--surface2);color:var(--muted);}
.lbl-live{background:var(--green-dim);color:var(--green);}
.lbl-tbd{background:var(--surface2);color:var(--muted);}
.sc-win{color:var(--green);} .sc-lose{color:var(--red);} .sc-draw{color:var(--amber);} .sc-tbd{color:var(--muted);}

/* ── GW BAR ── */
.gw-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.gw-bar label{font-size:12px;color:var(--muted);}
.gw-select{
  background:var(--surface2);border:1px solid var(--border2);border-radius:7px;
  color:var(--text);font-size:12px;padding:6px 10px;outline:none;
  cursor:pointer;transition:border-color .15s;
}
.gw-select:focus{border-color:var(--green);}
.gw-pts-note{font-size:11px;color:var(--muted);margin-left:auto;}

/* ── H2H CARDS ── */
.h2h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
.h2h-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;transition:border-color .15s;
}
.h2h-card:hover{border-color:var(--border2);}
.h2h-names{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.h2h-name{font-size:12px;font-weight:700;flex:1;line-height:1.3;}
.h2h-name.right{text-align:right;}
.h2h-vs-badge{
  font-size:9px;color:var(--muted);font-weight:800;letter-spacing:1px;
  background:var(--surface2);border-radius:4px;padding:2px 6px;flex-shrink:0;
}
.h2h-record{display:flex;gap:5px;}
.h2h-box{flex:1;text-align:center;background:var(--surface2);border-radius:7px;padding:8px 4px;}
.h2h-box .hb-num{font-size:18px;font-weight:800;}
.h2h-box .hb-lbl{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-top:2px;}
.h2h-box.win{background:var(--green-dim);border:1px solid var(--green-bd);}
.h2h-box.win .hb-num{color:var(--green);}
.h2h-box.lose .hb-num{color:var(--red);}
.h2h-box.draw .hb-num{color:var(--amber);}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;
}
.stat-card .sc-lbl{
  font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.stat-card .sc-lbl svg{color:var(--green);}
.stat-entry{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--border);gap:8px;
}
.stat-entry:last-child{border-bottom:none;}
.se-left{display:flex;align-items:center;gap:7px;}
.rank-dot{
  width:18px;height:18px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;
}
.rank-1{background:rgba(255,215,0,.15);color:#ffd700;}
.rank-2{background:rgba(192,192,192,.12);color:#c0c0c0;}
.rank-3{background:rgba(205,127,50,.12);color:#cd7f32;}
.rank-n{background:var(--surface2);color:var(--muted);}
.se-name{font-size:12px;font-weight:600;}
.se-val{font-size:13px;font-weight:700;color:var(--green);flex-shrink:0;}

/* ── RECORD CARD ── */
.record-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);}
.record-row:last-child{border-bottom:none;}
.rr-left{display:flex;align-items:center;gap:8px;}
.rr-icon{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.rr-icon.flame{background:rgba(255,100,50,.12);}
.rr-icon.snow{background:rgba(100,200,255,.12);}
.rr-icon.count{background:var(--surface2);}
.rr-icon svg{flex-shrink:0;}
.rr-label{font-size:12px;font-weight:600;}
.rr-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.rr-val{font-size:14px;font-weight:800;color:var(--green);}

/* ── RESULTS VIEW TOGGLE ── */
.view-toggle{
  display:flex;background:#f4f4f4;border-radius:8px;padding:3px;gap:2px;
}
.vt-btn{
  flex:1;padding:6px 14px;border:none;border-radius:6px;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .15s;background:none;color:#666;
  font-family:'Inter',system-ui,sans-serif;
}
.vt-btn.active{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.vt-btn:hover:not(.active){color:#333;}

/* GW selector row */
.filter-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
}
.filter-bar label{font-size:12px;color:#666;font-weight:500;}
.filter-select{
  background:#fff;border:1px solid #ddd;border-radius:7px;
  color:#111;font-size:12px;padding:6px 10px;outline:none;
  font-family:'Inter',system-ui,sans-serif;cursor:pointer;transition:border-color .15s;
}
.filter-select:focus{border-color:#3d195b;}

<script>
// ── Config ─────────────────────────────────────
const DEFAULT_LEAGUE_ID = "79703";
const FPL = "https://fantasy.premierleague.com/api";
// Proxy list — tried in order, first success wins
// Using a wider pool with better uptime for GitHub Pages hosting
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  u => `https://proxy.cors.sh/${u}`,
  u => `https://cors-anywhere.herokuapp.com/${u}`,
];

// ── State ──────────────────────────────────────
let S={leagueId:"",leagueName:"",standings:[],allMatches:[],gwList:[],selectedGW:null,currentGWId:null,isLive:false,refreshTimer:null,lastLoaded:0,resultsMode:'gw'};

// ── Hero canvas: starts after data renders to not block ──
function startCanvas(){
  const c = document.getElementById("hero-canvas");
  if (!c) return;
  const ctx = c.getContext("2d");
  let W, H, particles = [], t = 0;

  function resize() {
    W = c.width = c.offsetWidth || window.innerWidth;
    H = c.height = c.offsetHeight || 200;
  }

  function initParticles() {
    particles = [];
    for (let i = 0; i < 55; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .35,
        r: Math.random() * 1.8 + .4, a: Math.random() * .35 + .05
      });
    }
  }

  function drawPitch() {
    // Horizontal pitch lines — full width, subtle, animated opacity
    const lineCount = 6;
    for (let i = 0; i < lineCount; i++) {
      const y = (H / (lineCount + 1)) * (i + 1);
      const alpha = 0.04 + 0.03 * Math.sin(t * .015 + i);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.strokeStyle = `rgba(0,255,135,${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Vertical halfway line — full height
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.strokeStyle = `rgba(0,255,135,${0.05 + 0.02 * Math.sin(t * .012)})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Centre circle
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(H * .38, 80), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,255,135,${0.05 + 0.02 * Math.sin(t * .010)})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // Left penalty box
    const bw = W * .14, bh = H * .55, by = (H - bh) / 2;
    ctx.strokeStyle = `rgba(0,255,135,${0.06 + 0.02 * Math.sin(t * .008)})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(0, by, bw, bh);

    // Right penalty box
    ctx.strokeRect(W - bw, by, bw, bh);

    // Animated scanning line — sweeps left to right
    const scanX = ((t * 1.2) % (W + 80)) - 40;
    const scanGrad = ctx.createLinearGradient(scanX - 30, 0, scanX + 30, 0);
    scanGrad.addColorStop(0, "transparent");
    scanGrad.addColorStop(.5, "rgba(0,255,135,0.18)");
    scanGrad.addColorStop(1, "transparent");
    ctx.fillStyle = scanGrad;
    ctx.fillRect(scanX - 30, 0, 60, H);
  }

  function draw() {
    t++;
    ctx.clearRect(0, 0, W, H);

    // Subtle radial vignette
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*.6);
    grad.addColorStop(0, "rgba(55,0,60,0)");
    grad.addColorStop(1, "rgba(10,0,20,0.5)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawPitch();

    // Floating particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,135,${p.a})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", () => { resize(); initParticles(); });
  resize(); initParticles(); draw();
}
// Start canvas immediately but non-blocking
requestIdleCallback ? requestIdleCallback(startCanvas) : setTimeout(startCanvas, 100);



// ── SVG icon helper ────────────────────────────
function ic(path,size=14){return`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;}

// ── Fetch with retry + proxy fallback ──────────
async function apiFetch(path, attempt = 0) {
  const url = `${FPL}${path}`;
  const errors = [];

  for (let i = 0; i < PROXIES.length; i++) {
    // Update loading message so user knows it's still working
    const loadingMsg = document.getElementById("loading-msg");
    if (loadingMsg && i > 0) {
      loadingMsg.textContent = `Trying connection ${i + 1} of ${PROXIES.length}…`;
    }
    try {
      const res = await fetch(PROXIES[i](url), { signal: AbortSignal.timeout(5000) });
      if (!res.ok) { errors.push(`Proxy ${i+1}: HTTP ${res.status}`); continue; }
      const text = await res.text();
      if (!text || text.trim() === '') { errors.push(`Proxy ${i+1}: empty response`); continue; }
      // Strip any JSONP wrapper some proxies add
      const clean = text.trim().replace(/^[^{[]*([\[{])/,'$1').replace(/[^}\]]*$/,'');
      try {
        const j = JSON.parse(clean);
        if (j) return j;
      } catch(e) {
        // Try parsing original text
        const j = JSON.parse(text);
        if (j) return j;
      }
    } catch(e) {
      errors.push(`Proxy ${i+1}: ${e.message}`);
      continue;
    }
  }

  // All proxies failed — give a helpful message
  throw new Error(
    `Could not reach the FPL API. This is usually a temporary issue with the proxy services.<br><br>` +
    `<strong>Try these fixes:</strong><br>` +
    `• Wait 30 seconds and click Refresh<br>` +
    `• Try a different browser or disable any ad blocker<br>` +
    `• If the issue persists, the FPL API may be temporarily down`
  );
}

// ── Load ───────────────────────────────────────
function handleLoad(){
  const val=document.getElementById("league-input").value.trim();
  if(!val||isNaN(val)){showErr("Please enter a valid numeric League ID.");return;}
  clearErr();loadLeague(val);
}
document.getElementById("league-input").addEventListener("keydown",e=>{if(e.key==="Enter")handleLoad();});
window.addEventListener("load",()=>{
  const params=new URLSearchParams(window.location.search);
  const lid=params.get("league")||DEFAULT_LEAGUE_ID;
  document.getElementById("league-input").value=lid;
  loadLeague(lid);
});

async function loadLeague(leagueId){
  setLoading(true,"Connecting to FPL API…");
  document.getElementById("setup-wrap").style.display="none";
  clearErr();
  try{
    setLoading(true,"Loading league data…");

    // Fetch bootstrap + first page of standings + first page of matches in parallel
    const [bootResult, sd, firstPage] = await Promise.all([
      apiFetch("/bootstrap-static/").catch(()=>null),
      apiFetch(`/leagues-h2h/${leagueId}/standings/`),
      apiFetch(`/leagues-h2h-matches/league/${leagueId}/?page=1`)
    ]);

    // Process bootstrap
    if(bootResult){
      const cur=bootResult.events.find(e=>e.is_current)||bootResult.events.find(e=>e.is_next);
      S.currentGWId=cur?.id||null;
    }

    // Process standings
    if(!sd.standings) throw new Error("Not a valid H2H league ID. Check the ID and try again.");
    S.leagueName=sd.league.name;
    S.standings=sd.standings.results;
    S.leagueId=leagueId;

    // Render standings immediately so user sees something fast
    setLoading(false);
    S.allMatches=firstPage.results||[];
    S.gwList=[...new Set(S.allMatches.map(m=>m.event))].sort((a,b)=>a-b);
    S.selectedGW=S.currentGWId&&S.gwList.includes(S.currentGWId)?S.currentGWId:S.gwList[S.gwList.length-1];
    S.lastLoaded=Date.now();
    renderDashboard();

    // Fetch remaining pages in background
    if(firstPage.has_next){
      setLoading(false);
      let all=firstPage.results||[], page=2, hasNext=!!firstPage.has_next;

      // Fetch remaining pages — batch 3 at a time for speed
      while(hasNext && page<=50){
        const batch = [page, page+1, page+2].filter(p=>p<=50);
        setLoading(false);
        // Show subtle update indicator in header
        const lu = document.getElementById("last-updated");
        if(lu) lu.textContent = `Loading match history… (page ${page})`;

        const batchResults = await Promise.all(
          batch.map(p => apiFetch(`/leagues-h2h-matches/league/${leagueId}/?page=${p}`).catch(()=>({results:[],has_next:false})))
        );

        for(const r of batchResults){
          all=all.concat(r.results||[]);
        }
        // Check if any page had more
        hasNext = batchResults.some(r=>r.has_next) && batchResults[batchResults.length-1]?.results?.length>0;
        page+=3;
      }
      S.allMatches=all;
    } else {
      let all=firstPage.results||[];
      S.allMatches=all;
    }

    S.gwList=[...new Set(S.allMatches.map(m=>m.event))].sort((a,b)=>a-b);
    S.selectedGW=S.currentGWId&&S.gwList.includes(S.currentGWId)?S.currentGWId:S.gwList[S.gwList.length-1];
    S.lastLoaded=Date.now();
    S.isLive=S.currentGWId&&S.allMatches.filter(m=>m.event===S.currentGWId).some(m=>m.entry_1_points===null||m.entry_2_points===null);
    renderDashboard();

    clearInterval(S.refreshTimer);
    S.refreshTimer=setInterval(()=>refreshData(),60000);

    const url=new URL(window.location.href);
    url.searchParams.set("league",leagueId);
    window.history.replaceState({},"",url);

  }catch(err){
    setLoading(false);
    document.getElementById("setup-wrap").style.display="flex";
    showErr(err.message);
  }
}

async function refreshData(){
  try{
    const sd=await apiFetch(`/leagues-h2h/${S.leagueId}/standings/`);
    S.standings=sd.standings.results;
    let all=[],page=1,hasNext=true;
    while(hasNext&&page<=50){
      const md=await apiFetch(`/leagues-h2h-matches/league/${S.leagueId}/?page=${page}`);
      const results=md.results||[];
      all=all.concat(results);
      hasNext=!!md.has_next&&results.length>0;
      page++;
    }
    S.allMatches=all;
    S.lastLoaded=Date.now();
    S.isLive=S.currentGWId&&all.filter(m=>m.event===S.currentGWId).some(m=>m.entry_1_points===null||m.entry_2_points===null);
    renderDashboard();
  }catch(e){}
}

// ── UI helpers ─────────────────────────────────
function setLoading(on,msg){
  document.getElementById("loading-state").style.display=on?"flex":"none";
  document.getElementById("dashboard").style.display=on?"none":"block";
  if(msg) document.getElementById("loading-msg").textContent=msg;
  const btn=document.getElementById("load-btn");
  btn.disabled=on;
  btn.innerHTML=on?`<span class="spinner" style="width:13px;height:13px"></span>`:`${ic('<polygon points="5 3 19 12 5 21 5 3"/>',14)} Load`;
}
function showErr(msg){
  document.getElementById("error-area").innerHTML=`<div class="err-box">${ic('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',16)}<p><strong>Error</strong>${msg}</p></div>`;
}
function clearErr(){document.getElementById("error-area").innerHTML="";}
function showTab(id){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",["standings","results","h2h","stats"][i]===id));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(`panel-${id}`).classList.add("active");
}

// ── Form / streak ──────────────────────────────
function getForm(entryId,upToGW,count=5){
  return S.allMatches
    .filter(m=>m.event<=upToGW&&(m.entry_1_entry===entryId||m.entry_2_entry===entryId))
    .sort((a,b)=>b.event-a.event).slice(0,count).reverse()
    .map(m=>{
      const mine=m.entry_1_entry===entryId?m.entry_1_points:m.entry_2_points;
      const opp=m.entry_1_entry===entryId?m.entry_2_points:m.entry_1_points;
      if(mine===null||opp===null) return{r:"N",gw:m.event};
      return{r:mine>opp?"W":mine<opp?"L":"D",gw:m.event};
    });
}
function getStreak(entryId){
  const form=getForm(entryId,S.gwList[S.gwList.length-1],20);
  const results=form.filter(f=>f.r!=="N").reverse();
  if(!results.length) return null;
  const latest=results[0].r;
  let count=0;
  for(const f of results){if(f.r===latest)count++;else break;}
  return count>1?{r:latest,n:count}:null;
}

// ── Results helpers ────────────────────────────
// Map GW numbers to calendar months using FPL season schedule
// GW1 = August, roughly 4 GWs per month
function gwToMonth(gw) {
  // FPL season: Aug(1-3), Sep(4-7), Oct(8-11), Nov(12-15), Dec(16-20),
  //             Jan(21-24), Feb(25-27), Mar(28-31), Apr(32-35), May(36-38)
  if (gw <= 3)  return { key:'aug', label:'August' };
  if (gw <= 7)  return { key:'sep', label:'September' };
  if (gw <= 11) return { key:'oct', label:'October' };
  if (gw <= 15) return { key:'nov', label:'November' };
  if (gw <= 20) return { key:'dec', label:'December' };
  if (gw <= 24) return { key:'jan', label:'January' };
  if (gw <= 27) return { key:'feb', label:'February' };
  if (gw <= 31) return { key:'mar', label:'March' };
  if (gw <= 35) return { key:'apr', label:'April' };
  return { key:'may', label:'May' };
}

function getMonthList() {
  const seen = new Map();
  S.gwList.forEach(gw => {
    const m = gwToMonth(gw);
    if (!seen.has(m.key)) seen.set(m.key, { ...m, gws: [] });
    seen.get(m.key).gws.push(gw);
  });
  return [...seen.values()];
}

function buildMatchCard(m) {
  const p1=m.entry_1_points, p2=m.entry_2_points;
  const live=p1===null||p2===null;
  const p1w=!live&&p1>p2, p2w=!live&&p2>p1;
  const s1=live?"sc-tbd":p1w?"sc-win":p2w?"sc-lose":"sc-draw";
  const s2=live?"sc-tbd":p2w?"sc-win":p1w?"sc-lose":"sc-draw";
  const lbl=live?(S.isLive?"lbl-live":"lbl-tbd"):"lbl-ft";
  const lblText=live?(S.isLive?"LIVE":"TBD"):"FT";
  return `<div class="match-card ${live&&S.isLive?"is-live":""}">
    <div class="mc-side">
      <div class="mc-name ${p1w?"winner":""}">${m.entry_1_name}</div>
      <div class="mc-team">${m.entry_1_player_name}</div>
      ${m.entry_1_total?`<div class="mc-gw-pts">${m.entry_1_total} pts total</div>`:""}
    </div>
    <div class="mc-score">
      <div class="mc-nums">
        <span class="${s1}">${live?"—":p1}</span>
        <span class="mc-sep">–</span>
        <span class="${s2}">${live?"—":p2}</span>
      </div>
      <div class="mc-label ${lbl}">${lblText}</div>
    </div>
    <div class="mc-side right">
      <div class="mc-name ${p2w?"winner":""}">${m.entry_2_name}</div>
      <div class="mc-team">${m.entry_2_player_name}</div>
      ${m.entry_2_total?`<div class="mc-gw-pts">${m.entry_2_total} pts total</div>`:""}
    </div>
  </div>`;
}

// ── Month view ──────────────────────────────────
function renderMonthView(monthKey) {
  const months = getMonthList();
  const month = months.find(m => m.key === monthKey) || months[months.length - 1];

  const monthOpts = months.map(m =>
    `<option value="${m.key}" ${m.key===month.key?"selected":""}>${m.label}</option>`
  ).join("");

  // All completed matches in this month
  const monthMatches = S.allMatches.filter(m =>
    month.gws.includes(m.event) && m.entry_1_points !== null && m.entry_2_points !== null
  );

  if (!monthMatches.length) {
    document.getElementById("results-body").innerHTML = `
      <div class="filter-bar">
        <label>Month</label>
        <select class="filter-select" onchange="renderMonthView(this.value)">${monthOpts}</select>
      </div>
      <p style="color:#999;font-size:13px;text-align:center;padding:40px">No completed matches in ${month.label}.</p>`;
    return;
  }

  // Build per-manager stats for this month
  const entryMap = {};
  S.standings.forEach(e => {
    entryMap[e.entry] = {
      id: e.entry,
      name: e.entry_name,
      player: e.player_name,
      w: 0, d: 0, l: 0,
      ptsFor: 0, ptsAgainst: 0,
      gwResults: {}  // gw -> { pts, result }
    };
  });

  monthMatches.forEach(m => {
    const e1 = entryMap[m.entry_1_entry];
    const e2 = entryMap[m.entry_2_entry];
    if (!e1 || !e2) return;
    const p1 = m.entry_1_points, p2 = m.entry_2_points;
    e1.ptsFor += p1; e1.ptsAgainst += p2;
    e2.ptsFor += p2; e2.ptsAgainst += p1;
    if (p1 > p2)      { e1.w++; e2.l++; e1.gwResults[m.event]={pts:p1,r:'won'}; e2.gwResults[m.event]={pts:p2,r:'lost'}; }
    else if (p2 > p1) { e2.w++; e1.l++; e2.gwResults[m.event]={pts:p2,r:'won'}; e1.gwResults[m.event]={pts:p1,r:'lost'}; }
    else              { e1.d++; e2.d++;  e1.gwResults[m.event]={pts:p1,r:'drew'}; e2.gwResults[m.event]={pts:p2,r:'drew'}; }
  });

  // Sort: W desc, then net pts desc
  const ranked = Object.values(entryMap)
    .filter(e => e.w+e.d+e.l > 0)
    .sort((a, b) => {
      const aH2H = a.w*3 + a.d;
      const bH2H = b.w*3 + b.d;
      if (bH2H !== aH2H) return bH2H - aH2H;
      return (b.ptsFor - b.ptsAgainst) - (a.ptsFor - a.ptsAgainst);
    });

  // Table rows
  const rows = ranked.map((e, i) => {
    const pos = i + 1;
    const net = e.ptsFor - e.ptsAgainst;
    const netCls = net > 0 ? 'month-net-pos' : net < 0 ? 'month-net-neg' : 'month-net-zero';
    const netStr = net > 0 ? `+${net}` : `${net}`;
    const played = e.w + e.d + e.l;
    const pCls = pos===1?"pos-1":pos===2?"pos-2":pos===3?"pos-3":"pos-other";

    // GW-by-GW pills
    const gwPills = month.gws.map(gw => {
      const r = e.gwResults[gw];
      if (!r) return `<div class="month-gw-pill"><span class="gw-num">GW${gw}</span><span class="gw-pts" style="color:#ccc">—</span></div>`;
      return `<div class="month-gw-pill ${r.r}"><span class="gw-num">GW${gw}</span><span class="gw-pts">${r.pts}</span></div>`;
    }).join("");

    return `<tr>
      <td class="pos-td ${pCls}">
        <div class="pos-bar-wrap"><div class="pos-bar"></div><span class="pos-num">${pos}</span></div>
      </td>
      <td class="left">
        <div class="mgr-cell">
          <span class="mgr-name">${e.name}</span>
          <span class="mgr-team">${e.player}</span>
        </div>
      </td>
      <td class="num-cell">${played}</td>
      <td class="num-cell" style="color:#00963c;font-weight:600">${e.w}</td>
      <td class="num-cell" style="color:#888">${e.d}</td>
      <td class="num-cell" style="color:#d0021b;font-weight:600">${e.l}</td>
      <td class="num-cell">${e.ptsFor}</td>
      <td class="num-cell">${e.ptsAgainst}</td>
      <td class="num-cell ${netCls}">${netStr}</td>
      <td class="pts-cell">${e.w*3+e.d}</td>
      <td><div class="month-gw-pills">${gwPills}</div></td>
    </tr>`;
  }).join("");

  // Match cards grouped by GW
  const matchesByGW = month.gws.map(gw => {
    const gwMatches = monthMatches.filter(m => m.event === gw);
    if (!gwMatches.length) return '';
    return `
      <div class="month-matches-section">
        <h3>${ic('<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',12)}Gameweek ${gw}</h3>
        <div class="matches-grid">${gwMatches.map(buildMatchCard).join("")}</div>
      </div>`;
  }).join("");

  document.getElementById("results-body").innerHTML = `
    <div class="filter-bar">
      <label>Month</label>
      <select class="filter-select" onchange="renderMonthView(this.value)">${monthOpts}</select>
      <span class="filter-note">${ranked.length} managers · ${monthMatches.length} matches · GW${month.gws[0]}–${month.gws[month.gws.length-1]}</span>
    </div>

    <div class="month-tbl-wrap">
      <table class="month-table">
        <thead>
          <tr>
            <th class="pos-th">#</th>
            <th class="left">Manager</th>
            <th title="Played">PL</th>
            <th title="Won">W</th>
            <th title="Drawn">D</th>
            <th title="Lost">L</th>
            <th title="Points For">PF</th>
            <th title="Points Against">PA</th>
            <th title="Net Points">NET</th>
            <th title="H2H Points">PTS</th>
            <th>GW Breakdown</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${matchesByGW}`;
}

// --- Shared stats computation ---
function computeStats() {
  const completed = S.allMatches.filter(m => m.entry_1_points!==null && m.entry_2_points!==null);
  const wins={},losses={},pts={},highScore={},gwPts={};
  S.standings.forEach(e=>{wins[e.entry]=0;losses[e.entry]=0;pts[e.entry]=0;highScore[e.entry]=0;});
  completed.forEach(m=>{
    const e1=m.entry_1_entry,e2=m.entry_2_entry,p1=m.entry_1_points,p2=m.entry_2_points;
    pts[e1]=(pts[e1]||0)+p1; pts[e2]=(pts[e2]||0)+p2;
    highScore[e1]=Math.max(highScore[e1]||0,p1); highScore[e2]=Math.max(highScore[e2]||0,p2);
    if(p1>p2){wins[e1]=(wins[e1]||0)+1;losses[e2]=(losses[e2]||0)+1;}
    else if(p2>p1){wins[e2]=(wins[e2]||0)+1;losses[e1]=(losses[e1]||0)+1;}
    if(!gwPts[m.event]) gwPts[m.event]={};
    gwPts[m.event][e1]=(gwPts[m.event][e1]||0)+p1;
    gwPts[m.event][e2]=(gwPts[m.event][e2]||0)+p2;
  });
  const entryName = id=>(S.standings.find(e=>e.entry===id)||{}).entry_name||"Unknown";
  const topWins=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  const topHighScore=Object.entries(highScore).sort((a,b)=>b[1]-a[1]);
  const topPts=Object.entries(pts).sort((a,b)=>b[1]-a[1]);
  const topLosses=Object.entries(losses).sort((a,b)=>b[1]-a[1]);
  let bestGW={pts:0,name:"",gw:0},worstGW={pts:9999,name:"",gw:0};
  Object.entries(gwPts).forEach(([gw,scores])=>{
    Object.entries(scores).forEach(([eid,p])=>{
      if(p>bestGW.pts) bestGW={pts:p,name:entryName(parseInt(eid)),gw};
      if(p<worstGW.pts) worstGW={pts:p,name:entryName(parseInt(eid)),gw};
    });
  });
  return{wins,losses,pts,highScore,topWins,topHighScore,topPts,topLosses,bestGW,worstGW,completed,entryName};
}

// --- Build insight bar chips for a given tab context ---
function buildInsightBar(context) {
  if (!S.standings.length) return '';
  const st = computeStats();
  let chips = [];

  if (context === 'standings') {
    const leader = S.standings[0];
    const hotStreak = S.standings.map(e=>({e,streak:getStreak(e.entry)}))
      .filter(x=>x.streak?.r==='W').sort((a,b)=>b.streak.n-a.streak.n)[0];
    if(leader) chips.push({icon:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',color:'#f59e0b',val:leader.entry_name,lbl:`League leader &middot; <span class="insight-sub">${leader.total||0} pts &middot; ${leader.matches_won||0}W</span>`});
    if(st.topWins[0]) chips.push({icon:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',color:'#00963c',val:st.entryName(parseInt(st.topWins[0][0])),lbl:`Most wins &middot; <span class="insight-sub">${st.topWins[0][1]} this season</span>`});
    if(hotStreak) chips.push({icon:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>',color:'#ef4444',val:hotStreak.e.entry_name,lbl:`Hot streak &middot; <span class="insight-sub">${hotStreak.streak.n} wins in a row</span>`});
    if(st.bestGW.pts) chips.push({icon:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',color:'#3d195b',val:`${st.bestGW.pts} pts`,lbl:`Season high score &middot; <span class="insight-sub">${st.bestGW.name}</span>`});
  }

  if (context === 'results') {
    const lastGW = S.gwList[S.gwList.length-1];
    const gwM = S.allMatches.filter(m=>m.event===lastGW&&m.entry_1_points!==null);
    if(gwM.length){
      const topGW = gwM.reduce((b,m)=>{const p1={name:m.entry_1_name,pts:m.entry_1_points},p2={name:m.entry_2_name,pts:m.entry_2_points},top=p1.pts>p2.pts?p1:p2;return top.pts>(b?.pts||0)?top:b;},null);
      const bigWin = gwM.reduce((b,m)=>{const diff=Math.abs((m.entry_1_points||0)-(m.entry_2_points||0));return diff>(b?.diff||0)?{diff,name:m.entry_1_points>m.entry_2_points?m.entry_1_name:m.entry_2_name}:b;},null);
      if(topGW) chips.push({icon:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',color:'#f59e0b',val:`${topGW.pts} pts`,lbl:`GW${lastGW} top score &middot; <span class="insight-sub">${topGW.name}</span>`});
      if(bigWin) chips.push({icon:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',color:'#00963c',val:`+${bigWin.diff} pts`,lbl:`GW${lastGW} biggest win &middot; <span class="insight-sub">${bigWin.name}</span>`});
    }
    if(st.bestGW.pts) chips.push({icon:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',color:'#3d195b',val:`${st.bestGW.pts} pts`,lbl:`Season high &middot; <span class="insight-sub">${st.bestGW.name}</span>`});
    if(st.worstGW.pts<9999) chips.push({icon:'<line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>',color:'#6b7280',val:`${st.worstGW.pts} pts`,lbl:`Season low &middot; <span class="insight-sub">${st.worstGW.name}</span>`});
  }

  if (!chips.length) return '';
  return `<div class="insight-bar">${chips.map(c=>`
    <div class="insight-chip">
      <div class="insight-icon" style="color:${c.color}">${ic(c.icon,14)}</div>
      <div class="insight-body">
        <div class="insight-val">${c.val}</div>
        <div class="insight-lbl">${c.lbl}</div>
      </div>
    </div>`).join('')}</div>`;
}


// --- H2H Records: dropdown per manager ---
function renderH2H(selectedEntry) {
  const entries = S.standings;
  if (!entries.length) return;
  const entryId = selectedEntry || entries[0].entry;
  const me = entries.find(e => e.entry === entryId) || entries[0];
  const opts = entries.map(e =>
    `<option value="${e.entry}" ${e.entry===entryId?'selected':''}>${e.entry_name}</option>`
  ).join('');
  const completed = S.allMatches.filter(m => m.entry_1_points !== null && m.entry_2_points !== null);
  const records = entries
    .filter(e => e.entry !== entryId)
    .map(opp => {
      const games = completed.filter(m =>
        (m.entry_1_entry===entryId && m.entry_2_entry===opp.entry) ||
        (m.entry_1_entry===opp.entry && m.entry_2_entry===entryId)
      );
      let w=0,d=0,l=0,pf=0,pa=0;
      const history = [];
      games.sort((a,b)=>a.event-b.event).forEach(m => {
        const myPts  = m.entry_1_entry===entryId ? m.entry_1_points : m.entry_2_points;
        const oppPts = m.entry_1_entry===entryId ? m.entry_2_points : m.entry_1_points;
        pf += myPts; pa += oppPts;
        if (myPts > oppPts) { w++; history.push({gw:m.event,r:'W',myPts,oppPts}); }
        else if (oppPts > myPts) { l++; history.push({gw:m.event,r:'L',myPts,oppPts}); }
        else { d++; history.push({gw:m.event,r:'D',myPts,oppPts}); }
      });
      return { opp, w, d, l, pf, pa, net:pf-pa, played:games.length, history };
    })
    .sort((a,b) => (b.w*3+b.d)-(a.w*3+a.d) || b.net-a.net);

  const totW=records.reduce((s,r)=>s+r.w,0);
  const totD=records.reduce((s,r)=>s+r.d,0);
  const totL=records.reduce((s,r)=>s+r.l,0);
  const totNet=records.reduce((s,r)=>s+r.net,0);
  const nemesis  = records.slice().sort((a,b)=>b.l-a.l)[0];
  const favourite= records.slice().sort((a,b)=>b.w-a.w)[0];

  const recordRows = records.map(r => {
    const result = r.w>r.l?'dom':r.l>r.w?'sub':'even';
    const histPills = r.history.map(h =>
      `<span class="h2h-hist-pill ${h.r.toLowerCase()}" title="GW${h.gw}: ${h.myPts}-${h.oppPts}">${h.r}</span>`
    ).join('');
    const netStr = r.net>0?`+${r.net}`:`${r.net}`;
    const netCol = r.net>0?'#00963c':r.net<0?'#d0021b':'#888';
    return `<tr>
      <td class="left"><div class="mgr-cell"><span class="mgr-name">${r.opp.entry_name}</span><span class="mgr-team">${r.opp.player_name}</span></div></td>
      <td class="num-cell">${r.played}</td>
      <td class="num-cell" style="color:#00963c;font-weight:700">${r.w}</td>
      <td class="num-cell" style="color:#888">${r.d}</td>
      <td class="num-cell" style="color:#d0021b;font-weight:700">${r.l}</td>
      <td class="num-cell">${r.pf}</td>
      <td class="num-cell" style="color:${netCol};font-weight:600">${netStr}</td>
      <td><div class="h2h-hist-pills">${histPills}</div></td>
      <td><span class="h2h-verdict ${result}">${result==='dom'?'Dominates':result==='sub'?'Struggles':'Even'}</span></td>
    </tr>`;
  }).join('');

  const insightCards = `
    <div class="insight-bar">
      <div class="insight-chip">
        <div class="insight-icon" style="color:#00963c">${ic('<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',14)}</div>
        <div class="insight-body"><div class="insight-val">${totW}W – ${totD}D – ${totL}L</div><div class="insight-lbl">Overall H2H record</div></div>
      </div>
      <div class="insight-chip">
        <div class="insight-icon" style="color:#f59e0b">${ic('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',14)}</div>
        <div class="insight-body"><div class="insight-val">${favourite?.opp?.entry_name||'N/A'}</div><div class="insight-lbl">Best record vs <span class="insight-sub">${favourite?.w||0}W – ${favourite?.l||0}L</span></div></div>
      </div>
      <div class="insight-chip">
        <div class="insight-icon" style="color:#d0021b">${ic('<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',14)}</div>
        <div class="insight-body"><div class="insight-val">${nemesis?.opp?.entry_name||'N/A'}</div><div class="insight-lbl">Nemesis <span class="insight-sub">${nemesis?.l||0}L – ${nemesis?.w||0}W</span></div></div>
      </div>
      <div class="insight-chip">
        <div class="insight-icon" style="color:#3d195b">${ic('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',14)}</div>
        <div class="insight-body"><div class="insight-val" style="color:${totNet>=0?'#00963c':'#d0021b'}">${totNet>0?'+':''}${totNet} pts</div><div class="insight-lbl">Net points all H2H</div></div>
      </div>
    </div>`;

  document.getElementById("panel-h2h").innerHTML = `
    <div class="sec-hdr">
      <h2>${ic('<path d="m17 1 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 23-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>')}Head-to-Head Records</h2>
    </div>
    <div class="filter-bar">
      <label>Manager</label>
      <select class="filter-select" onchange="renderH2H(parseInt(this.value))">${opts}</select>
      <span class="filter-note">${me.player_name}</span>
    </div>
    ${insightCards}
    <div class="tbl-wrap" style="margin-top:16px">
      <table class="pl-table">
        <thead><tr>
          <th class="left">Opponent</th>
          <th title="Played">PL</th><th title="Won">W</th><th title="Drawn">D</th><th title="Lost">L</th>
          <th title="Points For">PF</th><th title="Net">NET</th>
          <th>History</th><th>Verdict</th>
        </tr></thead>
        <tbody>${recordRows}</tbody>
      </table>
    </div>`;
}

function renderStats(){
  const completed=S.allMatches.filter(m=>m.entry_1_points!==null&&m.entry_2_points!==null);
  const wins={},losses={},pts={},highScore={},gwPts={};
  S.standings.forEach(e=>{wins[e.entry]=0;losses[e.entry]=0;pts[e.entry]=0;highScore[e.entry]=0;});
  completed.forEach(m=>{
    const e1=m.entry_1_entry,e2=m.entry_2_entry,p1=m.entry_1_points,p2=m.entry_2_points;
    pts[e1]=(pts[e1]||0)+p1;pts[e2]=(pts[e2]||0)+p2;
    highScore[e1]=Math.max(highScore[e1]||0,p1);highScore[e2]=Math.max(highScore[e2]||0,p2);
    if(p1>p2){wins[e1]=(wins[e1]||0)+1;losses[e2]=(losses[e2]||0)+1;}
    else if(p2>p1){wins[e2]=(wins[e2]||0)+1;losses[e1]=(losses[e1]||0)+1;}
    if(!gwPts[m.event])gwPts[m.event]={};
    gwPts[m.event][e1]=(gwPts[m.event][e1]||0)+p1;
    gwPts[m.event][e2]=(gwPts[m.event][e2]||0)+p2;
  });
  const entryName=id=>(S.standings.find(e=>e.entry===id)||{}).entry_name||"Unknown";
  const topWins=Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topHighScore=Object.entries(highScore).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topPts=Object.entries(pts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topLosses=Object.entries(losses).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let bestGW={pts:0,name:"",gw:0},worstGW={pts:9999,name:"",gw:0};
  Object.entries(gwPts).forEach(([gw,scores])=>{
    Object.entries(scores).forEach(([eid,p])=>{
      if(p>bestGW.pts)bestGW={pts:p,name:entryName(parseInt(eid)),gw};
      if(p<worstGW.pts)worstGW={pts:p,name:entryName(parseInt(eid)),gw};
    });
  });

  const rankCls=i=>i===0?"rank-1":i===1?"rank-2":i===2?"rank-3":"rank-n";
  const rankNum=i=>i+1;

  const statBlock=(label,iconPath,entries,unit="")=>`
    <div class="stat-card">
      <div class="sc-lbl">${ic(iconPath,12)}${label}</div>
      ${entries.map(([id,val],i)=>`
        <div class="stat-entry">
          <div class="se-left">
            <div class="rank-dot ${rankCls(i)}">${rankNum(i)}</div>
            <div class="se-name">${entryName(parseInt(id))}</div>
          </div>
          <div class="se-val">${val}${unit}</div>
        </div>`).join("")}
    </div>`;

  document.getElementById("panel-stats").innerHTML=`
    <div class="sec-hdr">
      <h2>${ic('<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>')}Season Statistics</h2>
    </div>
    <div class="stats-grid">
      ${statBlock("Most Wins",'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',topWins)}
      ${statBlock("Highest Score",'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',topHighScore," pts")}
      ${statBlock("Most Points Scored",'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',topPts," pts")}
      ${statBlock("Most Losses",'<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',topLosses)}
      <div class="stat-card">
        <div class="sc-lbl">${ic('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',12)}Record Scores</div>
        <div class="record-row">
          <div class="rr-left">
            <div class="rr-icon flame">${ic('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>',13)}</div>
            <div><div class="rr-label">Best score</div><div class="rr-sub">${bestGW.name}</div></div>
          </div>
          <div class="rr-val">${bestGW.pts} pts</div>
        </div>
        <div class="record-row">
          <div class="rr-left">
            <div class="rr-icon snow">${ic('<line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>',13)}</div>
            <div><div class="rr-label">Lowest score</div><div class="rr-sub">${worstGW.pts<9999?worstGW.name:"—"}</div></div>
          </div>
          <div class="rr-val" style="color:var(--red)">${worstGW.pts<9999?worstGW.pts+" pts":"—"}</div>
        </div>
        <div class="record-row">
          <div class="rr-left">
            <div class="rr-icon count">${ic('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',13)}</div>
            <div><div class="rr-label">Matches played</div><div class="rr-sub">Season total</div></div>
          </div>
          <div class="rr-val" style="color:var(--cyan)">${completed.length}</div>
        </div>
      </div>
    </div>`;
}
</script>
